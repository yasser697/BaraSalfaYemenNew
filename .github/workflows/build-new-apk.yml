name: Build New APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'BaraSalfaYemenNew_logo_ready.zip'
      - '.github/workflows/build-new-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          mkdir source
          unzip -q BaraSalfaYemenNew_logo_ready.zip -d source

      - name: Build APK
        run: gradle -p source assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: BaraSalfa-debug-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
